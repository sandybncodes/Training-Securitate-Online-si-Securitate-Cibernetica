<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="ss-title ss-desc">
  <title id="ss-title">Clasă luminoasă</title>
  <desc id="ss-desc">Ilustrație stilizată, fără chipuri: o profesoară lângă tablă și patru elevi la bănci, unul dintre ei cu o tabletă.</desc>
